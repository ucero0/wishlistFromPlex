
services:
  postgres:
    image: postgres:15-alpine
    container_name: plex-orchestrator-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plex_orchestrator_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plex_orchestrator_pass}
      POSTGRES_DB: ${POSTGRES_DB:-plex_orchestrator}
    volumes:
      - ./infra/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plex_orchestrator_user} -d ${POSTGRES_DB:-plex_orchestrator}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plex-orchestrator-network
    restart: unless-stopped

  plex-orchestrator:
    build:
      context: ./services/plex-orchestrator
      target: runtime
    container_name: plex-orchestrator
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      antivirus:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-plex_orchestrator_user}:${POSTGRES_PASSWORD:-plex_orchestrator_pass}@postgres:5432/${POSTGRES_DB:-plex_orchestrator}
      API_KEY: ${API_KEY}
      PLEX_SERVER_URL: ${PLEX_SERVER_URL:-http://host.docker.internal:32400}
      PLEX_SERVER_ADMIN_TOKEN: ${PLEX_SERVER_ADMIN_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONTAINER_HOST_FS_PREFIX: ${CONTAINER_HOST_FS_PREFIX:-/host}
      # Deluge / Prowlarr — hostnames from .env (gluetun on VPN stack, deluge/prowlarr on no-vpn overlay)
      DELUGE_HOST: ${DELUGE_HOST}
      DELUGE_PORT: ${DELUGE_PORT:-58846}
      DELUGE_USERNAME: ${DELUGE_USERNAME}
      DELUGE_PASSWORD: ${DELUGE_PASSWORD}
      CONTAINER_DELUGE_QUARANTINE_PATH: ${CONTAINER_DELUGE_QUARANTINE_PATH}
      GLUETUN_HEALTH_URL: ${GLUETUN_HEALTH_URL:-http://gluetun:9999}
      # Scanner configuration
      # ANTIVIRUS_DAEMON_HOST and ANTIVIRUS_DAEMON_PORT are for the antivirus daemon (port 3310)
      # ANTIVIRUS_HOST and ANTIVIRUS_PORT are for the HTTP scan service (port 3311)
      ANTIVIRUS_DAEMON_HOST: antivirus
      ANTIVIRUS_DAEMON_PORT: 3310
      ANTIVIRUS_HOST: antivirus
      ANTIVIRUS_PORT: 3311
      # Prowlarr configuration
      PROWLARR_HOST: ${PROWLARR_HOST}
      PROWLARR_PORT: ${PROWLARR_PORT:-9696}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      # TMDB configuration
      TMDB_API_KEY: ${TMDB_API_KEY}
      TMDB_ACCESS_TOKEN: ${TMDB_ACCESS_TOKEN:-}
      TMDB_USER_NAME: ${TMDB_USER_NAME:-default}


    ports:
      - "8000:8000"
    volumes:
      - ./infra/deluge/downloads/quarantine:${CONTAINER_DELUGE_QUARANTINE_PATH}
      # Host filesystem at a fixed prefix — any Plex library path works without per-folder mounts
      - ${HOST_FS_BIND_SOURCE:-/}:${CONTAINER_HOST_FS_PREFIX:-/host}:rw,rslave
    networks:
      - plex-orchestrator-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${NORDVPN_USER}
      - OPENVPN_PASSWORD=${NORDVPN_PASSWORD}
      - HEALTH_SERVER_AUTH=no
      - HEALTH_SERVER_PORT=9999
      - HEALTH_SERVER_ADDRESS=0.0.0.0:9999
      - SERVER_COUNTRIES=${SERVER_COUNTRIES}
      - SERVER_CATEGORIES=${SERVER_CATEGORIES}
      - FIREWALL=on
      - FIREWALL_INPUT_PORTS=${DELUGE_WEB_PORT:-8112},${DELUGE_PORT:-58846},${PROWLARR_PORT:-9696},9999
      # Gluetun DNS (127.0.0.1): resolves public indexers; Docker DNS (127.0.0.11) NXDOMAIN'd trackers via host resolver.
      - DNS_ADDRESS=127.0.0.1
      - BLOCK_MALICIOUS=off
      - DNS_UNBLOCK_HOSTNAMES=1337x.to,www.limetorrents.fun,eztvx.to,eztv.wf,eztv.tf,eztv.yt,eztv1.xyz,www.529074.xyz,thepiratebay.org
      - FIREWALL_OUTBOUND_SUBNETS=192.168.0.0/16,172.16.0.0/12,172.18.0.0/16
      - FIREWALL_IPV6=off
    ports:
      - "${DELUGE_WEB_PORT:-8112}:${DELUGE_WEB_PORT:-8112}"
      - "${DELUGE_PORT:-58846}:${DELUGE_PORT:-58846}"
      - "${PROWLARR_PORT:-9696}:${PROWLARR_PORT:-9696}"
    volumes:
      - ./infra/gluetun:/gluetun
      - ./infra/gluetun/health-monitor-wrapper.sh:/health-monitor-wrapper.sh:ro
      - ./infra/gluetun/entrypoint-wrapper.sh:/entrypoint-wrapper.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint-wrapper.sh"]
    networks:
      - plex-orchestrator-network
    healthcheck:
      # Check VPN connection status by verifying:
      # 1. OpenVPN process is running (process name is openvpn2.6, not openvpn)
      # 2. tun0 interface exists and has an IP address (VPN tunnel is established)
      # When AUTH_FAILED occurs, OpenVPN will exit and tun0 won't exist, making healthcheck fail
      # The health-monitor-wrapper.sh script runs alongside gluetun and exits the container
      # when it becomes unhealthy (after 3 consecutive failures), triggering Docker's restart policy
      test: ["CMD-SHELL", "pgrep openvpn > /dev/null && test -d /proc/sys/net/ipv4/conf/tun0 && ip addr show tun0 | grep -q 'inet ' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 10s
    restart: unless-stopped
    labels:
      - autoheal=true

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    environment:
      # Only restart containers labeled autoheal=true (gluetun)
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      # Poll interval; gluetun healthcheck runs every 10s
      - AUTOHEAL_INTERVAL=10
      # Grace period after container start before autoheal may restart it (VPN connect can be slow)
      - AUTOHEAL_START_PERIOD=120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  vpn-stack-sync:
    image: docker:cli
    container_name: vpn-stack-sync
    restart: unless-stopped
    environment:
      - COMPOSE_PROJECT_DIR=/stack
      - COMPOSE_FILE=/stack/docker-compose.yml
      - GLUETUN_CONTAINER=gluetun
      - VPN_DEPENDENTS=deluge prowlarr flaresolverr
      - HEALTH_WAIT_SECONDS=180
      - SETTLE_SECONDS=15
      - DEBOUNCE_SECONDS=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/stack:ro
      - ./infra/gluetun/sync-vpn-dependents.sh:/usr/local/bin/sync-vpn-dependents:ro
      - ./infra/gluetun/vpn-stack-sync.entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      gluetun:
        condition: service_started

  deluge:
    image: linuxserver/deluge:latest
    container_name: deluge
    network_mode: "service:gluetun"
    # Shares Gluetun network — ports published on gluetun, not here
    environment:
      - CONTAINER_DELUGE_QUARANTINE_PATH=${CONTAINER_DELUGE_QUARANTINE_PATH}
      - DELUGE_USERNAME=${DELUGE_USERNAME:-deluge}
      - DELUGE_PASSWORD=${DELUGE_PASSWORD}
      - DELUGE_WEB_PASSWORD=${DELUGE_WEB_PASSWORD:-}
      - DELUGE_FORCE_WEB_PASSWORD=${DELUGE_FORCE_WEB_PASSWORD:-}
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - DELUGE_LOGLEVEL=info
      - API_KEY=${API_KEY}
      - SCANFORVIRUS_API_URL=${SCANFORVIRUS_API_URL}
    volumes:
      - ./infra/deluge/config:/config
      - ./infra/deluge/downloads/quarantine:${CONTAINER_DELUGE_QUARANTINE_PATH}
      - ./infra/deluge/custom-cont-init.d:/custom-cont-init.d:ro
      - ./infra/deluge/custom-services.d:/custom-services.d:ro
      - ./infra/deluge/scripts:/scripts:ro
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      # Deluge Web UI password for Prowlarr download client (synced every start by bootstrap)
      - DELUGE_PASSWORD=${DELUGE_PASSWORD}
      - DELUGE_WEB_PASSWORD=${DELUGE_WEB_PASSWORD:-}
      - PROWLARR_BOOTSTRAP_SEED=/bootstrap/seed.json
      # FlareSolverr shares Gluetun namespace (127.0.0.1) so CF cookies match Prowlarr's VPN exit IP.
      - FLARESOLVERR_URL=${FLARESOLVERR_URL:-http://127.0.0.1:${FLARESOLVERR_PORT:-8191}}
      - FLARESOLVERR_REQUEST_TIMEOUT=${FLARESOLVERR_REQUEST_TIMEOUT:-120}
      - PROWLARR_DELUGE_HOST=${PROWLARR_BOOTSTRAP_DELUGE_HOST:-127.0.0.1}
      - PROWLARR_DELUGE_WEB_PORT=${DELUGE_WEB_PORT:-8112}
      - PROWLARR_DELUGE_CATEGORY=${PROWLARR_DELUGE_CATEGORY:-prowlarr}
      - PROWLARR_FLARESOLVERR_TAG=${PROWLARR_FLARESOLVERR_TAG:-flaresolverr}
      - PROWLARR_BOOTSTRAP_FORCE=${PROWLARR_BOOTSTRAP_FORCE:-false}
    volumes:
      - ./infra/prowlarr/config:/config
      - ./infra/prowlarr/bootstrap:/bootstrap:ro
      - ./infra/prowlarr/scripts:/scripts:ro
      - ./infra/prowlarr/custom-cont-init.d:/custom-cont-init.d:ro
      - ./infra/prowlarr/custom-services.d:/custom-services.d:ro
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    # Same VPN namespace as Prowlarr — Cloudflare cookies must match indexer exit IP.
    network_mode: "service:gluetun"
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - TZ=Europe/Madrid
      - CAPTCHA_SOLVER=${FLARESOLVERR_CAPTCHA_SOLVER:-none}
      - BROWSER_TIMEOUT=${FLARESOLVERR_BROWSER_TIMEOUT:-120000}
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  plex:
    profiles: ["plex-docker"]
    image: linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ./infra/plex/config:/config
      # Plex library roots: add bind mounts here (same container paths as in Plex library settings)
      # Example: - D:/Media/Movies:/movies
      #          - D:/Media/TV:/tv
    ports:
      - "32400:32400"
    networks:
      - plex-orchestrator-network
    restart: unless-stopped

  antivirus:
    image: clamav/clamav:latest  # Always use latest image for latest ClamAV version
    container_name: antivirus
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
      - CLAMAV_NO_CLAMD=false
    volumes:
      - ./infra/deluge/downloads/quarantine:${CONTAINER_DELUGE_QUARANTINE_PATH}:rw  # Shared quarantine folder (read-write)
      - ./infra/antivirus/data:/var/lib/clamav
      - ./infra/antivirus/update-scripts:/update-scripts:ro
      - ./infra/antivirus/scan-service:/scan-service:ro
      - ./infra/antivirus/yara-rules:/yara-rules:rw  # Read-write for YARA rule updates
    healthcheck:
      # Check both services:
      # 1. Clamd daemon is responding on port 3310 (antivirus engine) - required
      # 2. HTTP scan service process is running (used by FastAPI) - required
      # The HTTP service listens on port 3311, but we check the process instead of the port
      # to avoid connection issues during healthcheck
      test: ["CMD-SHELL", "echo 'PING' | nc localhost 3310 | grep -q 'PONG' && pgrep -f 'http_scan_server.py' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - plex-orchestrator-network
    restart: unless-stopped
    # Use custom startup script that installs dependencies and starts services
    # The startup script will then call the default /init entrypoint
    entrypoint: ["/bin/sh", "/scan-service/startup.sh"]

networks:
  plex-orchestrator-network:
    driver: bridge

