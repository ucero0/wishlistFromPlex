# Development overlay — hot reload and live source bind mounts.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  plex-orchestrator:
    build:
      target: dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/plex-orchestrator/app:/app/app
      - ./services/plex-orchestrator/main.py:/app/main.py
      - ./services/plex-orchestrator/alembic:/app/alembic
      - ./services/plex-orchestrator/alembic.ini:/app/alembic.ini
