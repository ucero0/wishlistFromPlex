# Development overlay — hot reload and live source bind mounts.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  fastapi:
    build:
      target: dev
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./services/fastapi-app/app:/app/app
      - ./services/fastapi-app/main.py:/app/main.py
