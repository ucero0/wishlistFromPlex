# Full stack WITHOUT Gluetun/NordVPN — for local development and testing.
#
# Usage:
#   docker compose -f docker-compose.no-vpn.yml up -d --build
#   docker compose -f docker-compose.no-vpn.yml -f docker-compose.dev.yml up -d --build   # + hot reload
#
# .env:
#   DELUGE_HOST=deluge
#   PROWLARR_HOST=prowlarr
#   (NordVPN variables not required)
#
# Prowlarr UI: set Deluge to deluge:8112 and FlareSolverr to http://flaresolverr:8191
# if prowlarr.db still has 127.0.0.1 from the VPN layout.

services:
  db:
    image: postgres:15-alpine
    container_name: fastapi-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plex_wishlist_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plex_wishlist_pass}
      POSTGRES_DB: ${POSTGRES_DB:-plex_wishlist}
    volumes:
      - ./infra/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plex_wishlist_user} -d ${POSTGRES_DB:-plex_wishlist}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastapi-network
    restart: unless-stopped

  fastapi:
    build:
      context: ./services/fastapi-app
      target: runtime
    container_name: fastapi-app
    depends_on:
      db:
        condition: service_healthy
      antivirus:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-plex_wishlist_user}:${POSTGRES_PASSWORD:-plex_wishlist_pass}@db:5432/${POSTGRES_DB:-plex_wishlist}
      API_KEY: ${API_KEY}
      PLEX_SERVER_URL: ${PLEX_SERVER_URL:-http://host.docker.internal:32400}
      PLEX_SERVER_ADMIN_TOKEN: ${PLEX_SERVER_ADMIN_TOKEN:-}
      PLEX_SYNC_INTERVAL_HOURS: ${PLEX_SYNC_INTERVAL_HOURS:-6}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DELUGE_HOST: ${DELUGE_HOST:-deluge}
      DELUGE_PORT: ${DELUGE_PORT:-58846}
      DELUGE_USERNAME: ${DELUGE_USERNAME}
      DELUGE_PASSWORD: ${DELUGE_PASSWORD}
      CONTAINER_DELUGE_QUARANTINE_PATH: ${CONTAINER_DELUGE_QUARANTINE_PATH}
      ANTIVIRUS_DAEMON_HOST: antivirus
      ANTIVIRUS_DAEMON_PORT: 3310
      ANTIVIRUS_HOST: antivirus
      ANTIVIRUS_PORT: 3311
      PROWLARR_HOST: ${PROWLARR_HOST:-prowlarr}
      PROWLARR_PORT: ${PROWLARR_PORT:-9696}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      TMDB_API_KEY: ${TMDB_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./infra/deluge/downloads/quarantine:${CONTAINER_DELUGE_QUARANTINE_PATH}
    networks:
      - fastapi-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  deluge:
    image: linuxserver/deluge:latest
    container_name: deluge
    networks:
      - fastapi-network
    ports:
      - "8112:8112"
      - "58846:58846"
    environment:
      - CONTAINER_DELUGE_QUARANTINE_PATH=${CONTAINER_DELUGE_QUARANTINE_PATH}
      - DELUGE_USERNAME=${DELUGE_USERNAME:-deluge}
      - DELUGE_PASSWORD=${DELUGE_PASSWORD}
      - DELUGE_WEB_PASSWORD=${DELUGE_WEB_PASSWORD:-}
      - DELUGE_FORCE_WEB_PASSWORD=${DELUGE_FORCE_WEB_PASSWORD:-}
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - DELUGE_LOGLEVEL=info
      - API_KEY=${API_KEY}
      - SCANFORVIRUS_API_URL=${SCANFORVIRUS_API_URL}
    volumes:
      - ./infra/deluge/config:/config
      - ./infra/deluge/downloads/quarantine:${CONTAINER_DELUGE_QUARANTINE_PATH}
      - ./infra/deluge/custom-cont-init.d:/custom-cont-init.d:ro
      - ./infra/deluge/scripts:/scripts:ro
    restart: unless-stopped

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - fastapi-network
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    volumes:
      - ./infra/prowlarr/config:/config
    restart: unless-stopped

  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    networks:
      - fastapi-network
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - TZ=Europe/Madrid
      - CAPTCHA_SOLVER=${FLARESOLVERR_CAPTCHA_SOLVER:-none}
    restart: unless-stopped

  plex:
    profiles: ["plex-docker"]
    image: linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - VERSION=docker
      - PLEX_CLAIM=${PLEX_CLAIM:-}
    volumes:
      - ./infra/plex/config:/config
    ports:
      - "32400:32400"
    networks:
      - fastapi-network
    restart: unless-stopped

  antivirus:
    image: clamav/clamav:latest
    container_name: antivirus
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
      - CLAMAV_NO_CLAMD=false
    volumes:
      - ./infra/deluge/downloads/quarantine:${CONTAINER_DELUGE_QUARANTINE_PATH}:rw
      - ./infra/antivirus/data:/var/lib/clamav
      - ./infra/antivirus/update-scripts:/update-scripts:ro
      - ./infra/antivirus/scan-service:/scan-service:ro
      - ./infra/antivirus/yara-rules:/yara-rules:rw
    healthcheck:
      test: ["CMD-SHELL", "echo 'PING' | nc localhost 3310 | grep -q 'PONG' && pgrep -f 'http_scan_server.py' > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    networks:
      - fastapi-network
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scan-service/startup.sh"]

networks:
  fastapi-network:
    driver: bridge
